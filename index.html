<!DOCTYPE html>
<html lang="hi">

  <head><link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katariya Result | India's Fastest Education Updates</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f8ff;
}

header{
background:#0f172a;
color:white;
padding:20px;
text-align:center;
}

header h1{
font-size:32px;
color:#fbbf24;
}

header p{
margin-top:5px;
font-size:14px;
}

.news{
background:red;
color:white;
padding:10px;
font-weight:bold;
overflow:hidden;
white-space:nowrap;
}

.news marquee{
font-size:16px;
}

.search{
padding:20px;
text-align:center;
}

.search input{
width:90%;
max-width:500px;
padding:14px;
border-radius:30px;
border:2px solid #2563eb;
font-size:16px;
}

.menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.card:hover{
background:#2563eb;
color:white;
}
</style>

</head>
<body>

<header>
<h1>KATARIYA RESULT</h1>
<p>India's Fastest Education Updates</p>
</header>

<div class="news">
<marquee>
🔥 Welcome to Katariya Result | Latest Results | Jobs | Admit Card | Answer Key | Scholarship Updates
</marquee>
</div>

<div class="search">
<input type="text" placeholder="Search Results, Jobs...">
</div>

<div class="menu">
<div class="card">📢 Latest Results</div>
<div class="card">💼 Latest Jobs</div>
<div class="card">🎫 Admit Card</div>
<div class="card">📄 Answer Key</div>
<div class="card">📚 Syllabus</div>
<div class="card">🎓 Scholarship</div>
</div>

</<script src="script.js"></script>body>
</html>
